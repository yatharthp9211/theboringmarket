server:
  host: localhost
  ws_port: 3001
  rest_port: 3000
  ws_url: ws://localhost:3001/ws/sensing

serial:
  # Only this Standard ESP32 receives PC-selected bulb commands.
  actuator_port: COM11
  # Standard ESP32 DevKit with CH340 driving LEDs on GPIO 2, 4, 5:
  port: COM11

  # All ESP COM ports connected via USB to PC:
  ports:
    - COM11  # Standard ESP32 (Node 3)
    - COM6   # ESP32-C3 (Node 1)
    - COM7   # ESP32-C3 (Node 2)

  # A CSI line measures ~950 bytes, so 115200 could carry ~12 frames/s -- but
  # the nodes only emit 1-3.6 CSI frames/s (the firmware scan loop paces the
  # emitter), so the UART is not the bottleneck here. Supported: 115200, 230400,
  # 460800, 921600, 1000000, 1500000, 2000000. Raising this REQUIRES the
  # matching change in the firmware (Serial.begin() in
  # esp32_receiver_actuator.ino) and vice versa, otherwise every line decodes
  # as garbage.
  baud_rate: 115200
  timeout_s: 0.5

room:
  name: Tabletop 4-Node Transceiver Grid (CSI + RSSI)
  width_m: 1.0
  length_m: 0.7
  height_m: 0.5

room_calibration:
  auto_detect: true
  auto_calibrate_on_start: true
  auto_calibrate_variance: true
  width_m: 1.0
  length_m: 0.7
  grid_resolution_m: 0.02
  per_link_packets: 80
  calibration_duration_s: 45.0
  set_variance_from_calibration: true
  # The PC owns calibration and detection. Keep bulbs disarmed until the PC
  # has collected enough live samples for every configured bulb zone.
  require_calibration_for_actuation: true
  use_csi_auto_tune: true

model:
  repo_id: ruvnet/wifi-densepose-pretrained
  weights_path: models/wifi-densepose/csi-embed-v2.safetensors
  presence_head_path: models/wifi-densepose/presence-head.json
  config_path: models/wifi-densepose/config.json
  embedding_dim: 128
  tomography_grid:
  - 20
  - 14
  enabled: true

csi:
  enabled: true
  num_subcarriers: 56
  csi_fmt: espressif_htltf_v1
  subcarrier_order: ieee_80211n_56
  wavelength_m: 0.125
  calibration_packets: 50
  drift_tracking_alpha: 0.001
  displacement_threshold_mm: 0.45
  phase_calibration: true
  phase_unwrapping: true
  multipath_k_factor_threshold: 3.0
  trilateration:
    min_nodes: 3
    gdop_threshold: 5.0
    lm_init_lambda: 0.001
    max_residual_m: 0.12
    free_space_excess_m: 0.05
    static_object_corner: null
  kalman:
    process_noise_base: 0.003
    measurement_noise_base: 0.045
    measurement_noise_floor_ratio: 0.50
    stationary_noise_scale: 0.05
    moving_noise_scale: 1.5
    sigmoid_midpoint_mps: 0.06
    sigmoid_width_mps: 0.025
    outlier_mahalanobis_threshold: 15.0

tomography:
  architecture: tabletop_y_delta_4node
  var_noise_floor: 0.0003
  var_energy_gain: 700.0
  shadow_thresh_fraction: 0.65
  shadow_energy_gain: 3.8
  rx_convergence_threshold: 0.68
  require_all_3_links_for_rx_convergence: false
  link_weight_exponent: 1.0
  secondary_zone_var_ratio: 0.0

receiver:
  id: rx_hub
  label: 'Rx Hub: ESP32 Receiver (COM11)'
  layout_preset: tabletop_4node
  pos_m:
  - 0.50
  - 0.40

nodes:
  node_1:
    id: node_1
    port: COM6
    label: 'V1: ESP32-C3 Transceiver #1 (COM6)'
    ssid: Zone_1_Tx
    channel: 6
    role: ESP32-C3 Transceiver (AP+STA + CSI)
    pos_m:
    - 0.50
    - 0.05
    led_pin: 2
    variance_threshold: 0.0020
    drop_threshold_dbm: 1.8
    color: '#22d3ee'

  node_2:
    id: node_2
    port: COM7
    label: 'V2: ESP32-C3 Transceiver #2 (COM7)'
    ssid: Zone_2_Tx
    channel: 6
    role: ESP32-C3 Transceiver (AP+STA + CSI)
    pos_m:
    - 0.80
    - 0.57
    led_pin: 4
    variance_threshold: 0.0020
    drop_threshold_dbm: 1.8
    color: '#fbbf24'

  node_3:
    id: node_3
    port: COM11
    label: 'V3: Standard ESP32 (COM11 - Transceiver)'
    ssid: Zone_3_Tx
    channel: 6
    role: ESP32 Standard (AP+STA + CSI)
    pos_m:
    - 0.20
    - 0.57
    led_pin: 5
    variance_threshold: 0.0020
    drop_threshold_dbm: 1.8
    color: '#f87171'

  node_4:
    id: node_4
    label: 'C: Mobile Phone Hotspot (Centroid)'
    ssid: YOUR_HOTSPOT_SSID
    # The phone hotspot is the base AP for the whole rig. It picks its own
    # 2.4 GHz channel on every start and the boards follow it: an ESP32 in
    # AP+STA mode drags its own SoftAP onto the channel it associates to.
    # 2.4 GHz is mandatory - the ESP32-C3 has no 5 GHz radio. The channel below
    # is the fallback used before the first hardware frame arrives; after that
    # the engine adopts the channel the frames actually report.
    channel: 1
    role: Centroid Mobile Hotspot (C)
    pos_m:
    - 0.50
    - 0.40
    led_pin: -1
    variance_threshold: 0.0020
    drop_threshold_dbm: 1.8
    color: '#a78bfa'

beacons:
  zone_1:
    name: Zone_1_Tx
    ssid: Zone_1_Tx
    zone: node_1
    node_id: node_1
  zone_2:
    name: Zone_2_Tx
    ssid: Zone_2_Tx
    zone: node_2
    node_id: node_2
  zone_3:
    name: Zone_3_Tx
    ssid: Zone_3_Tx
    zone: node_3
    node_id: node_3
  zone_4:
    name: YOUR_HOTSPOT_SSID
    ssid: YOUR_HOTSPOT_SSID
    zone: node_4
    node_id: node_4

led_hold_time_s: 1.2
variance_window: 16
serial_timeout_s: 0.05
debug: false
